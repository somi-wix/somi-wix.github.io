<head>
    <title>TypeMaster v1.0.0</title>
    <link rel="stylesheet" href="./css/type-master.css"/>
</head>

<body>
    <h1>TypeMaster v1.0.0</h1>
    <div id="main-area">
        <select onchange="init(this.options[this.selectedIndex].value)" name="Difficulty" id="difficulty-dropdown">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
            <option value="very_hard">Very Hard</option>
            <option value="insane">Insane</option>
        </select>
        <h2 id="word-string"></h2>
        <div>
            <input type="text" id="input-area"></input>
        </div>
        <h3 class="padding-20px" id="time-left">Time left: <span id="time-left-text"></span></h3>
        <div class="status-row">
            <h3 class="padding-20px" id="charps">Characters per second: <span id="charps-text"></span></h3>
            <h3 class="padding-20px">Score: <span id="score-text">0</span></h3>
        </div>
        <h3 id="final-score">Final Score: <span id="final-score-text"></span></h3>
        <button type="button" onclick="clearLeaderBoard()">Clear Leaderboard</button>
    </div>
    <div id="leaderboard-area">
        <table id="leaderboard">
            <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Difficulty</th>
                <th>Score</th>
                <th>Highest Keystrokes per Second</th>
            </tr>
        </table>
    </div>
    <script src="./js/index.js"></script>
</body>
